name: dusk

permissions:
  contents: read

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  browser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy CI env
        run: cp .env.example .env

      - name: Configure Dusk runner environment
        run: |
          sed -i 's/^APP_ENV=.*/APP_ENV=ci/' .env
          sed -i 's/^APP_DEBUG=.*/APP_DEBUG=false/' .env
          sed -i 's/^APP_LOCALE=.*/APP_LOCALE=en/' .env
          sed -i 's/^APP_FALLBACK_LOCALE=.*/APP_FALLBACK_LOCALE=en/' .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=pgsql/' .env
          sed -i 's/^DB_HOST=.*/DB_HOST=pgsql/' .env
          sed -i 's/^DB_PORT=.*/DB_PORT=5432/' .env
          sed -i 's/^DB_DATABASE=.*/DB_DATABASE=laravel/' .env
          sed -i 's/^DB_USERNAME=.*/DB_USERNAME=sail/' .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=password/' .env

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, intl, bcmath

      - name: Install Sail from lockfile
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader
          test -x vendor/bin/sail

      - name: Build and start browser services
        run: |
          ./vendor/bin/sail build --no-cache
          ./vendor/bin/sail up -d

      - name: Install application dependencies
        run: ./vendor/bin/sail composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install and build frontend assets
        run: |
          ./vendor/bin/sail yarn install --frozen-lockfile
          ./vendor/bin/sail yarn run build

      - name: Prepare databases and application key
        run: |
          ./vendor/bin/sail artisan key:generate --no-interaction
          ./vendor/bin/sail exec dusk php artisan migrate --force --no-interaction

      - name: Wait for Selenium
        run: |
          for attempt in $(seq 1 30); do
            if docker compose exec -T selenium curl -fsS http://localhost:4444/status >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Run Dusk
        run: ./vendor/bin/sail artisan dusk --without-tty

      - name: Upload Dusk artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dusk-artifacts
          path: |
            tests/Browser/screenshots
            tests/Browser/console
            tests/Browser/source
          if-no-files-found: ignore
