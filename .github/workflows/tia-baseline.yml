name: pest-tia-baseline

on:
  push:
    branches:
      - develop
      - main
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports: [ 3306:3306 ]
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Copy CI env
        run: |
          cp .env.example .env
          cp .env.example .env.testing

      - name: Configure .env
        run: |
          kv() { key="$1"; val="$2"; if grep -qE "^[#\s]*${key}=" .env; then sed -i "s|^[#\s]*${key}=.*|${key}=${val}|" .env; else echo "${key}=${val}" >> .env; fi; }
          kv APP_ENV local
          kv APP_DEBUG true
          kv APP_LOCALE en
          kv APP_FALLBACK_LOCALE en
          kv DB_CONNECTION pgsql
          kv DB_HOST pgsql
          kv DB_PORT 5432
          kv DB_DATABASE laravel
          kv DB_USERNAME sail
          kv DB_PASSWORD password

      - name: Configure .env.testing
        run: |
          kv() { key="$1"; val="$2"; if grep -qE "^[#\s]*${key}=" .env.testing; then sed -i "s|^[#\s]*${key}=.*|${key}=${val}|" .env.testing; else echo "${key}=${val}" >> .env.testing; fi; }
          kv APP_ENV testing
          kv APP_DEBUG true
          kv APP_LOCALE en
          kv APP_FALLBACK_LOCALE en
          kv DB_CONNECTION pgsql
          kv DB_HOST pgsql
          kv DB_PORT 5432
          kv DB_DATABASE laravel
          kv DB_USERNAME sail
          kv DB_PASSWORD password

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, intl, bcmath
          coverage: xdebug, pcov

      - name: Ensure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Sail from lockfile
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader
          if ! composer show laravel/sail --direct >/dev/null 2>&1; then
            echo "laravel/sail must be declared in composer.json before CI can run Sail." >&2
            exit 1
          fi

      - name: Build containers
        run: ./vendor/bin/sail build --no-cache

      - name: Up containers
        run: ./vendor/bin/sail up -d

      - name: Install dependencies
        run: ./vendor/bin/sail composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install frontend dependencies
        run: ./vendor/bin/sail yarn install

      - name: Build frontend assets
        run: ./vendor/bin/sail yarn run build

      - name: Generate Application Key
        run: |
          ./vendor/bin/sail artisan key:generate
          ./vendor/bin/sail artisan key:generate --env=testing

      - name: Publish Ziggy Configuration
        run: |
          ./vendor/bin/sail artisan ziggy:generate
          ./vendor/bin/sail artisan ziggy:generate --env=testing

      - name: Migrate testing DB
        run: ./vendor/bin/sail artisan migrate --force

      - name: Create fresh Pest TIA baseline
        run: ./vendor/bin/sail exec -u sail -e TIA_VITE_PAGES_DIR=resources/js/pages laravel.test php vendor/bin/pest --configuration=phpunit.tia.xml --parallel --tia --fresh

      - name: Copy TIA baseline out of Sail
        run: |
          mkdir -p "$RUNNER_TEMP/pest-tia"
          baseline_path="$(./vendor/bin/sail exec -u sail -e TIA_VITE_PAGES_DIR=resources/js/pages laravel.test php vendor/bin/pest --configuration=phpunit.tia.xml --baseline)"
          container_id="$(docker compose ps -q laravel.test)"
          docker exec "$container_id" test -s "$baseline_path/graph.json"
          docker cp "$container_id:$baseline_path/." "$RUNNER_TEMP/pest-tia/"
          test -s "$RUNNER_TEMP/pest-tia/graph.json"

      - name: Upload Pest TIA baseline
        uses: actions/upload-artifact@v4
        with:
          name: pest-tia-baseline
          path: ${{ runner.temp }}/pest-tia
          include-hidden-files: true
          retention-days: 30
