name: tests

permissions:
  actions: read
  contents: read

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

jobs:
  sail-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: testing
          MYSQL_ROOT_PASSWORD: password
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Copy CI env
        run: |
          cp .env.example .env
          cp .env.example .env.testing

      - name: Configure .env
        run: |
          kv() { key="$1"; val="$2"; if grep -qE "^[#\s]*${key}=" .env; then sed -i "s|^[#\s]*${key}=.*|${key}=${val}|" .env; else echo "${key}=${val}" >> .env; fi; }
          kv APP_ENV local
          kv APP_DEBUG true
          kv APP_LOCALE en
          kv APP_FALLBACK_LOCALE en
          kv DB_CONNECTION pgsql
          kv DB_HOST pgsql
          kv DB_PORT 5432
          kv DB_DATABASE laravel
          kv DB_USERNAME sail
          kv DB_PASSWORD password

      - name: Configure .env.testing
        run: |
          kv() { key="$1"; val="$2"; if grep -qE "^[#\s]*${key}=" .env.testing; then sed -i "s|^[#\s]*${key}=.*|${key}=${val}|" .env.testing; else echo "${key}=${val}" >> .env.testing; fi; }
          kv APP_ENV testing
          kv APP_DEBUG true
          kv APP_LOCALE en
          kv APP_FALLBACK_LOCALE en
          kv DB_CONNECTION pgsql
          kv DB_HOST pgsql
          kv DB_PORT 5432
          kv DB_DATABASE laravel
          kv DB_USERNAME sail
          kv DB_PASSWORD password

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, sqlite, intl, bcmath
          coverage: xdebug, pcov

      - name: Ensure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Sail from lockfile
        run: |
          composer install --prefer-dist --no-interaction --no-progress --no-scripts --optimize-autoloader
          if ! composer show laravel/sail --direct >/dev/null 2>&1; then
            echo "laravel/sail must be declared in composer.json before CI can run Sail." >&2
            exit 1
          fi

      - name: Build containers
        run: ./vendor/bin/sail build --no-cache

      - name: Up containers
        run: ./vendor/bin/sail up -d

      - name: Install dependencies
        run: ./vendor/bin/sail composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Install frontend dependencies
        run: ./vendor/bin/sail yarn install
      - name: Build frontend assets
        run: ./vendor/bin/sail yarn run build

      - name: Generate Application Key
        run: |
          ./vendor/bin/sail artisan key:generate
          ./vendor/bin/sail artisan key:generate --env=testing

      - name: Publish Ziggy Configuration
        run: |
          ./vendor/bin/sail artisan ziggy:generate
          ./vendor/bin/sail artisan ziggy:generate --env=testing

      # - name: Create SQLite database file
      #   run: touch database/testing.sqlite

      - name: Migrate testing DB
        run: |
          ./vendor/bin/sail artisan migrate --force

      - name: Download TIA baseline when available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_branch="${{ github.base_ref || github.ref_name }}"
          mkdir -p "$RUNNER_TEMP/pest-tia"
          run_id="$(gh run list --workflow pest-tia-baseline.yml --branch "$baseline_branch" --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)"

          if [ -n "$run_id" ]; then
            gh run download "$run_id" --name pest-tia-baseline --dir "$RUNNER_TEMP/pest-tia"
            container_id="$(docker compose ps -q laravel.test)"
            baseline_path="$(./vendor/bin/sail exec -u sail -e TIA_VITE_PAGES_DIR=resources/js/pages laravel.test php vendor/bin/pest --baseline)"
            docker exec "$container_id" mkdir -p "$baseline_path"
            docker cp "$RUNNER_TEMP/pest-tia/." "$container_id:$baseline_path/"
            docker exec "$container_id" chown -R sail:sail "$baseline_path"
            docker exec "$container_id" test -s "$baseline_path/graph.json"
          else
            echo "No successful TIA baseline was found for $baseline_branch; Pest will create a local baseline."
          fi

      - name: Pest TIA suite
        run: |
          ./vendor/bin/sail exec -u sail -e TIA_VITE_PAGES_DIR=resources/js/pages laravel.test php vendor/bin/pest --parallel --tia

      - name: Pest full suite
        run: |
          ./vendor/bin/sail php vendor/bin/pest --parallel --no-tia
